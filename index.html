<head>

<title>SPORT – Mon suivi sportif</title>
<style>
:root{--bg:#f2f5fb;--card:#ffffff;--card2:#eef2f9;--bd:#dbe2ee;--ac:#1f6feb;--ac2:#1556c0;--tx:#14213d;--mu:#667389;--gr:#16a34a;--or:#f59e0b;--bl:#1f6feb;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{color-scheme:light;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
main{max-width:640px;margin:0 auto;padding:14px 14px 20px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:15px;margin:16px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
p{margin:4px 0}
.mu{color:var(--mu)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0}
.hero{background:linear-gradient(135deg,#dbe8ff,#f5f8ff 75%);border-color:#bcd2fb}
.card,.kpi,.ex,details{box-shadow:0 1px 3px rgba(20,33,61,.06)}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}
.kpi span{color:var(--mu);font-size:12px}
.btn{appearance:none;border:0;background:var(--ac);color:#fff;font-weight:700;font-size:16px;padding:13px 18px;border-radius:14px;cursor:pointer;width:100%}
.btn:active{transform:scale(.98);background:var(--ac2)}
.btn.ghost{background:#fff;border:1px solid #b8c8f5;color:var(--ac)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.danger{background:#fff1f1;border:1px solid #f3c1c1;color:#c62828}
.btn.green{background:#16a34a}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--bd);color:var(--tx);padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
.pcard.on{border-color:var(--ac);background:#eaf2ff}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.tag.today{background:var(--ac);color:#fff}
select,input{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--ac)}
canvas{width:100%;height:210px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.adv{border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;border:1px solid}
.adv.up{background:#e8f8ef;border-color:#a8e3c1;color:#0f6b36}
.adv.keep{background:#fff6e0;border-color:#f2d58b;color:#8a5a00}
.adv.down{background:#fdecec;border-color:#f1b5b5;color:#b42318}
.adv.new{background:#eaf0ff;border-color:#b8c8f5;color:#2a4bb0}
.chipx{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chipx.up{background:#d9f3e4;color:#0f6b36}.chipx.keep{background:#fdeec7;color:#8a5a00}.chipx.down{background:#fbdcdc;color:#b42318}.chipx.new{background:#dfe8ff;color:#2a4bb0}
.ex{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:12px 0}
.ex.complete{border-color:#7bd3a1;background:#f6fcf9}
.ex h4{margin:0;font-size:17px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin:7px 0}
.set.cardio{grid-template-columns:26px 1fr 1fr 1fr 58px}.set.time{grid-template-columns:26px 1fr 1fr 46px}
.set .n{color:var(--mu);font-weight:700;text-align:center}
.f{position:relative;display:block}
.f input{padding-right:38px;text-align:center;font-size:18px;font-weight:700}
.f i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mu);font-size:12px;pointer-events:none}
.chk{appearance:none;border:2px solid var(--bd);background:var(--card2);color:var(--mu);height:44px;border-radius:12px;font-size:20px;font-weight:800;cursor:pointer}
.set.done .chk{background:var(--gr);border-color:var(--gr);color:#fff}
.set.done input{opacity:.65}
.sticky{position:sticky;top:0;z-index:20;background:rgba(242,245,251,.96);backdrop-filter:blur(8px);padding:10px 14px;margin:-14px -14px 8px;border-bottom:1px solid var(--bd)}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}.bar>div{height:100%;background:var(--ac);transition:width .3s}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;appearance:none;border:0;background:none;color:var(--mu);padding:9px 0 8px;font-size:11px;font-weight:700;cursor:pointer}
#tabs button span{display:block;font-size:20px;line-height:1.2}
#tabs button{font-size:10.5px!important}
.stp{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center;margin:4px 0 8px}
.stp b{text-align:center;font-size:26px;font-variant-numeric:tabular-nums}
.stp b small{font-size:13px;color:var(--mu);font-weight:600;margin-left:4px}
.stp .ib{width:48px;height:48px;font-size:24px;border-radius:12px;color:var(--ac);border-color:#b8c8f5;background:#fff}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px;flex:none}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.pl:last-child{border:0}.pl .a{display:flex;align-items:center;min-width:0;font-weight:700}
.pl .b{white-space:nowrap;color:var(--mu)}.pl .b b{color:var(--tx)}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.sw{width:36px;height:36px;border-radius:10px;border:3px solid transparent;cursor:pointer;padding:0;appearance:none}
.sw.on{border-color:#14213d}
.warm{border-color:#b8c8f5;background:#f7faff}
.warm.complete{border-color:#7bd3a1;background:#f6fcf9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

#tabs button.on{color:var(--ac)}
#rest{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;background:#fff;border:2px solid var(--ac);border-radius:16px;padding:10px 12px;display:none;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(20,33,61,.25);max-width:616px;margin:0 auto}
#rest.show{display:flex}#rest.go{border-color:var(--gr);background:#effaf3}
#rest .t{font-size:22px;white-space:nowrap;font-weight:800;flex:1;font-variant-numeric:tabular-nums}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(20,33,61,.45)}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;border:1px solid var(--bd)}
#sheet h3{margin-top:0;color:var(--tx);font-size:18px;text-transform:none;letter-spacing:0}
.fl{display:block;margin:10px 0;font-size:13px;color:var(--mu);font-weight:600}.fl input,.fl select{margin-top:5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.erow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.erow:last-child{border:0}
.erow .nm{flex:1;min-width:0}.erow .nm b{display:block;font-size:15px}
.ib{appearance:none;border:1px solid var(--bd);background:var(--card2);color:var(--tx);width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer}
.pick{padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14213d;color:#fff;border:1px solid #14213d;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;max-width:90%}
details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:12px monospace}
.srch{margin-bottom:6px}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ex-suggest{margin-top:6px;max-height:260px;overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}
.ex-suggest:empty{display:none}.ex-suggest .pick:last-child{border-bottom:0}.type-fields{margin-top:4px}.cardio-grid{grid-template-columns:1fr 1fr 1fr}.field-hidden{display:none!important}
/* Premium 2026 */
.card,.kpi,.ex,details{box-shadow:0 7px 24px rgba(20,33,61,.07);border-color:#e2e8f2}.card{padding:16px}.kpi{padding:15px}.btn{min-height:48px}.ib{min-width:42px;height:42px}.ex{padding:14px;margin:16px 0;border-radius:20px}.ex.complete{background:#effaf3;border-color:#73cf98}.set{grid-template-columns:38px 1fr 1fr 58px;gap:10px;margin:8px 0 14px;padding:10px;border-radius:14px;background:#f8faff;transition:.22s}.set.done{background:#e8f8ef;box-shadow:inset 0 0 0 1px #9bdcb6;animation:setok .28s ease}.set .n{font-size:19px;color:#1f6feb}.f input{height:54px;font-size:21px;background:#fff}.chk{height:54px;font-size:25px}.prevline{margin:12px 0 2px;padding:7px 10px;color:#647895;background:#f3f7fd;border-radius:10px;font-size:12px}.exhead{padding-bottom:10px;border-bottom:1px solid #edf1f7}.rest-inline{margin:8px 0;padding:13px;border-radius:14px;background:#edf5ff;border:1px solid #b9d3ff}.rest-inline .clock{font-size:28px;font-weight:850;color:#1556c0;font-variant-numeric:tabular-nums}.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.cal .dow{text-align:center;color:var(--mu);font-size:11px;font-weight:800}.cal .day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:#f5f7fb;font-size:12px}.cal .trained{background:#1f6feb;color:#fff;font-weight:800;box-shadow:0 3px 9px rgba(31,111,235,.25)}.cal .blank{background:transparent}.perfmini{padding:10px 0;border-bottom:1px solid #edf1f7}.perfmini:last-child{border:0}.premium-weight{height:290px!important}.danger-zone{margin-top:26px}.restcfg{display:flex;align-items:center;gap:6px;margin-top:8px}.pulse{animation:setok .28s ease}@keyframes setok{0%{transform:scale(.98)}65%{transform:scale(1.015)}100%{transform:scale(1)}}
@media(max-width:420px){.set{grid-template-columns:34px 1fr 1fr 54px;padding:8px;gap:7px}.set.cardio{grid-template-columns:30px 1fr 1fr 1fr 48px}.f input{font-size:19px}.ex{padding:12px}.grid4{gap:8px}.kpi b{font-size:21px}}

/* SPORT - interface alternative iPhone */
:root{--bg:#f1f4f9;--card:#ffffff;--card2:#f7f9fc;--tx:#101828;--mu:#718096;--bd:#e8edf5;--blue:#2563eb;--green:#16a34a;--red:#dc2626}
body{background:radial-gradient(circle at 15% -10%,#dbeafe 0,transparent 30%),linear-gradient(180deg,#f8faff 0,#f1f4f9 38%,#eef2f7 100%);letter-spacing:-.01em}
#view{max-width:780px;padding:20px 16px 150px}
h1{font-size:32px;line-height:1.05;letter-spacing:-1.1px;margin:12px 0 5px}h2{font-size:19px;letter-spacing:-.35px;margin:27px 2px 11px}.mu{color:#718096}
.card,.kpi,.ex,details{border:0;background:rgba(255,255,255,.94);box-shadow:0 12px 34px rgba(28,50,91,.075)}
.card{border-radius:24px;padding:19px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f4fd6 0%,#3178f6 58%,#61a2ff 100%);color:#fff;padding:24px;box-shadow:0 18px 38px rgba(37,99,235,.24)}
.hero:after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;right:-55px;top:-65px;background:rgba(255,255,255,.12)}.hero .mu{color:rgba(255,255,255,.78)}.hero .btn{background:#fff;color:#1d5ed7;box-shadow:0 7px 20px rgba(0,0,0,.13)}
.grid4{grid-template-columns:repeat(2,1fr);gap:11px}.kpi{min-height:102px;border-radius:22px;display:flex;flex-direction:column;justify-content:center}.kpi b{font-size:25px;letter-spacing:-.7px}.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.45px;margin-top:6px}
.btn{border-radius:16px;min-height:52px;font-weight:800;letter-spacing:.1px;background:linear-gradient(135deg,#1f63e9,#347ef7);box-shadow:0 8px 18px rgba(37,99,235,.20)}.btn.ghost{background:#f3f6fb;color:#295994;box-shadow:none;border:1px solid #e3eaf5}.btn.green{background:linear-gradient(135deg,#119a55,#22b968)}.btn.danger{background:linear-gradient(135deg,#d62c3e,#ed4557)}
.chip{border:0;background:#eef3fa;color:#53657d;padding:9px 13px}.chip.on{background:#e2ecff;color:#1e5cd1;box-shadow:inset 0 0 0 1px #b9d0ff}
.ex{border-radius:26px;padding:17px;margin:19px 0}.exhead{border:0;padding-bottom:5px}.exhead b{font-size:18px}.prevline{background:transparent;border:0;border-left:3px solid #bfd3f6;border-radius:0;padding:3px 9px;margin:14px 4px 5px;color:#7386a3}
.set{background:#f3f6fb;border:1px solid #ebf0f7;border-radius:18px;padding:11px;gap:9px}.set .n{width:34px;height:34px;border-radius:12px;background:#e5edfc;display:grid;place-items:center;color:#245fc8;font-size:16px}.set.done{background:#ecf9f1;border-color:#c0e6ce;box-shadow:0 8px 22px rgba(22,163,74,.10)}.set.done .n{background:#24a760;color:#fff}.f label{font-size:10px;letter-spacing:.55px}.f input{height:58px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #dce4ef;font-size:23px;font-weight:800}.chk{width:auto;min-width:58px;height:58px;border-radius:15px;background:#2467e8;color:#fff;border:0}.set.done .chk{background:#16a34a}
#rest{left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));border:0;border-radius:22px;padding:12px;background:rgba(15,37,70,.96);box-shadow:0 18px 44px rgba(15,37,70,.28);backdrop-filter:blur(18px)}#rest .t{color:#fff;font-size:17px}#rest .ib,#rest .btn{min-height:42px;height:42px;background:#fff;color:#173c76;box-shadow:none}
#tabs{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:70px;border:0;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 14px 40px rgba(28,50,91,.18);backdrop-filter:blur(20px);padding:6px;grid-template-columns:repeat(6,1fr)}#tabs button{border-radius:17px;color:#8794a8;font-size:9px;gap:2px}#tabs button span{font-size:19px}#tabs button.on{background:#eaf1ff;color:#1f61da;transform:translateY(-1px)}
#sheet .pn{border-radius:28px 28px 0 0;padding:22px;background:#fff;box-shadow:0 -18px 50px rgba(16,24,40,.18)}
details{border-radius:20px;padding:15px;margin:12px 0}.cal{gap:7px}.cal .day{border-radius:12px;background:#f4f6fa}.cal .trained{background:linear-gradient(135deg,#1f63e9,#4d8cff)}
canvas{border-radius:16px}.premium-weight{height:315px!important}.perfmini{padding:13px 2px}.tag{border:0}.today{background:rgba(255,255,255,.18);color:#fff}
#toast{border:0;border-radius:16px;background:#11233f;box-shadow:0 14px 35px rgba(17,35,63,.25)}
@media(max-width:420px){#view{padding-left:12px;padding-right:12px}h1{font-size:29px}.card{padding:16px}.ex{padding:13px}.set{grid-template-columns:35px 1fr 1fr 56px}.kpi{padding:13px}.kpi b{font-size:22px}#tabs{left:7px;right:7px}.premium-weight{height:280px!important}}

.excompare select{height:50px;background:#f4f7fc;border:0;box-shadow:inset 0 0 0 1px #e3eaf4;font-weight:750}.excurve-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.excurve-summary>div{padding:12px;border-radius:16px;background:#f4f7fc}.excurve-summary b{display:block;font-size:19px;color:#14213d}.excurve-summary span{display:block;margin-top:4px;color:#718096;font-size:11px;line-height:1.3}.excompare .legend{padding-top:8px;border-top:1px solid #edf1f7}.excompare .legend span{display:flex;align-items:center}.excompare .legend i{width:22px;height:4px}

/* Liquid Glass navigation */
#tabs{
 left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));height:74px;
 padding:7px;border:1px solid rgba(255,255,255,.70);border-radius:27px;
 background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(238,246,255,.42));
 -webkit-backdrop-filter:blur(28px) saturate(185%);backdrop-filter:blur(28px) saturate(185%);
 box-shadow:0 16px 42px rgba(35,62,105,.20),inset 0 1px 0 rgba(255,255,255,.92),inset 0 -1px 0 rgba(134,163,204,.14);
 overflow:hidden;isolation:isolate
}
#tabs:before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.65) 0%,rgba(255,255,255,.16) 32%,rgba(130,187,255,.10) 63%,rgba(255,255,255,.42) 100%);z-index:-1}
#tabs:after{content:'';position:absolute;left:8%;right:8%;top:1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);pointer-events:none}
#tabs button{position:relative;background:transparent!important;color:#78879b;border:1px solid transparent;border-radius:20px;transition:transform .18s ease,color .18s ease,background .18s ease,box-shadow .18s ease;z-index:1}
#tabs button:active{transform:scale(.94)}
#tabs button.on{color:#1559ca!important;background:linear-gradient(150deg,rgba(255,255,255,.88),rgba(218,234,255,.63))!important;border-color:rgba(255,255,255,.92);box-shadow:0 7px 18px rgba(45,92,159,.16),inset 0 1px 1px rgba(255,255,255,1),inset 0 -1px 1px rgba(116,160,221,.12);transform:translateY(-1px)}
#tabs button.on:before{content:'';position:absolute;left:20%;right:20%;top:3px;height:1px;background:rgba(255,255,255,.95);border-radius:99px}
#tabs button span{filter:drop-shadow(0 1px 0 rgba(255,255,255,.8));transition:transform .18s ease}#tabs button.on span{transform:scale(1.08)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#tabs{background:rgba(246,250,255,.96)}}

/* Dark Mode */

body.dark .card,body.dark .kpi,body.dark .ex,body.dark details{background:rgba(17,23,34,.94);box-shadow:0 13px 34px rgba(0,0,0,.26)}
body.dark .hero{background:linear-gradient(135deg,#123d8f 0%,#1e5fc9 58%,#3979df 100%)}
body.dark .kpi b,body.dark h1,body.dark h2,body.dark h3,body.dark b{color:#f4f7fb}
body.dark .mu,body.dark .sm{color:#91a0b5}
body.dark .chip{background:#182233;color:#a9b7cc}body.dark .chip.on{background:#193462;color:#8bb2ff}

let memOnly=false;
function lastWarm(list){
 const ss=list.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
 let inc=0,sp=0;
 ss.forEach(x=>{if(x.warm){if(x.warm.incline)inc=x.warm.incline;if(x.warm.speed)sp=x.warm.speed}});
 return{incline:Math.min(16,Math.max(1,Math.round(inc)||1)),speed:Math.min(20,Math.max(0.5,Math.round((sp||0.5)*2)/2))};
}
function migrate(o){
 o.sessions=o.sessions.filter(x=>!(x.minutes===0&&x.dur===0));
 o.weights=Array.isArray(o.weights)?o.weights:[];o.trash=Array.isArray(o.trash)?o.trash:[];o.appTrash=Array.isArray(o.appTrash)?o.appTrash:[];o.customExercises=Array.isArray(o.customExercises)?o.customExercises:[];o.hiddenExercises=Array.isArray(o.hiddenExercises)?o.hiddenExercises:[];if(o.goalW===undefined)o.goalW=null;o.health=o.health||{};o.health.steps=o.health.steps||{};o.health.provider=o.health.provider||'none';o.health.lastSync=o.health.lastSync||null;
 o.ui=o.ui||{};o.ui.pie=o.ui.pie||'vol';o.ui.wRange=o.ui.wRange||'all';o.ui.calMonth=o.ui.calMonth||todayISO().slice(0,7);o.ui.homeExKey=o.ui.homeExKey||null;o.ui.theme=o.ui.theme||'light';
 o.programs.forEach((p,i)=>{if(!p.color)p.color=DEFCOL[p.id]||PAL[i%PAL.length];p.name=up(p.name)});
 o.sessions.forEach(x=>{if(!x.warm){const k=x.exos.findIndex(e=>e.key==='marche-inclinee');if(k>=0){const e=x.exos[k],st=e.sets[0]||{};x.warm={min:parseFloat(st.r)||10,incline:Math.min(16,Math.max(0,parseFloat(st.w)||0)),speed:0};x.exos.splice(k,1)}}});
 if(o.active&&!o.active.warm){const lw=lastWarm(o.sessions);o.active.warm={min:10,incline:lw.incline,speed:lw.speed,done:false,tEnd:0}}
 return o;
}

/* ================= iOS / HealthKit bridge preparation =================
   Web/PWA mode: IronLog continues to work normally.
   Future iOS host: expose window.webkit.messageHandlers.ironlogHealth.
   Native -> Web: call window.IronLogHealth.updateSteps({date:'YYYY-MM-DD',steps:8426,source:'healthkit'}).
*/
window.IronLogHealth={
 version:1,
 isNative(){return !!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.ironlogHealth)},
 requestAuthorization(){
  if(!this.isNative())return false;
  window.webkit.messageHandlers.ironlogHealth.postMessage({action:'requestAuthorization',types:['stepCount']});return true;
 },
 requestTodaySteps(){
  if(!this.isNative())return false;
  window.webkit.messageHandlers.ironlogHealth.postMessage({action:'readTodaySteps',date:todayISO(),type:'stepCount'});return true;
 },
 updateSteps(payload){
  if(!payload)return false;const date=payload.date||todayISO(),steps=Math.max(0,Math.round(num(payload.steps)));
  S.health=S.health||{steps:{},provider:'none',lastSync:null};S.health.steps=S.health.steps||{};S.health.steps[date]=steps;S.health.provider=payload.source||'healthkit';S.health.lastSync=new Date().toISOString();save();if(S.ui.tab==='dash')render();return true;
 },
 authorizationResult(payload){
  S.health=S.health||{steps:{}};S.health.authorization=payload&&payload.status?payload.status:'unknown';save();if(S.ui.tab==='dash')render();
 }
};

function lastPerf(key){

}

/* Progression double : toutes les séries à la charge max atteignent le haut de la fourchette => on augmente */
function suggest(e,last){
 const min=e.min,max=e.max,inc=e.inc==null?2.5:e.inc;
 if(!last||!last.sets.length)return{type:'new',text:'Première fois : choisis une charge qui te permet de finir '+(min===max?max:min+'-'+max)+(e.mode==='time'?' s':e.mode==='cardio'?' min':' reps')+' proprement.',weight:null,r:min};
 if(e.mode==='cardio'){const m=Math.max(...last.sets.map(s=>s.r));return{type:'up',text:'Dernière fois '+fmt(m)+' min → vise '+fmt(m+1)+' min (ou une intensité un cran au-dessus).',weight:null,r:m+1}}
 if(e.mode==='time'){const m=Math.min(...last.sets.map(s=>s.r));if(m>=max)return{type:'up',text:'Toutes les séries à '+max+' s → vise '+(max+5)+' s.',weight:null,r:max+5};return{type:'keep',text:'Vise '+max+' s sur chaque série (dernière fois : '+fmt(m)+' s mini).',weight:null,r:Math.min(max,m+5)}}
 const top=Math.max(...last.sets.map(s=>s.w));
 const ws=last.sets.filter(s=>s.w===top);
 const avg=ws.reduce((a,s)=>a+s.r,0)/ws.length;
 const rng=min===max?String(max):min+'-'+max;
 if(ws.length>=Math.min(2,last.sets.length)&&ws.every(s=>s.r>=max)){
  if(inc>0){const w=r05(top+inc);return{type:'up',text:'↑ Passe à '+fmt(w)+' kg : toutes tes séries à '+fmt(top)+' kg ont atteint '+max+' reps (+'+fmt(inc)+' kg).',weight:w,r:min}}
  return{type:'up',text:'↑ Toutes les séries ont atteint '+max+' reps : ajoute du lest ou ralentis la descente.',weight:top,r:min};
 }
 if(avg<min-2){const w=Math.max(0,r05(top-inc));return{type:'down',text:'↓ Baisse à '+fmt(w)+' kg : ~'+fmt(avg)+' reps de moyenne pour un objectif de '+rng+'.',weight:w,r:min}}
 return{type:'keep',text:'= Garde '+fmt(top)+' kg : vise '+max+' reps sur toutes les séries (moyenne dernière fois : '+fmt(avg)+', objectif '+rng+').',weight:top,r:Math.min(max,Math.ceil(avg)+0)};
}

/* ================= Génération de séance selon la durée ================= */
const workSecs=e=>e.mode==='time'?(e.max||40):40;
const setSecs=(e,rest)=>workSecs(e)+rest;
const exSecs=(e,n,rest)=>e.mode==='cardio'?(e.max||10)*60:60+n*setSecs(e,rest);
function buildPlan(p,dur){
 const rest=p.rest||75;
 const warm=600;
 const budget=dur*60-warm;
 let items=p.ex.map(e=>Object.assign({},e,{planned:e.mode==='cardio'?1:e.sets}));
 const total=()=>items.reduce((a,i)=>a+exSecs(i,i.planned,rest),0);
 let guard=300;
 while(total()>budget&&guard--){
  // choisit l'exercice avec le plus de séries (le dernier en cas d'égalité)
  let mx=2,ci=-1;items.forEach((i,k)=>{if(i.mode!=='cardio'&&i.planned>2&&i.planned>=mx){mx=i.planned;ci=k}});
  if(ci>=0){items[ci].planned--;continue}
  if(items.length>2)items.pop();else break;
 }
 const kept=new Set(items.map(i=>i.id));
 const dropped=p.ex.filter(e=>!kept.has(e.id));
 // marge de temps : ajoute jusqu'à +1 série sur les exercices prioritaires
 let changed=true;
 while(changed){changed=false;
  for(const i of items.slice(0,3)){
   if(i.mode==='cardio'||i.planned>=i.sets+(dur>=90?2:1))continue;
   if(dropped.length)break;
   if(total()+setSecs(i,rest)<=budget){i.planned++;changed=true}
  }
 }
 return{items,dropped,total:total()+warm,budget:dur*60,warm,rest};
}
function newExo(e,planned,rest){
 const key=slug(e.name),last=lastPerf(key),sug=suggest(e,last);
 const sets=[];
 planned=3;
 for(let j=0;j<planned;j++){sets.push({w:'',r:'',incline:e.mode==='cardio'?(e.incline||''):'',speed:e.mode==='cardio'?(e.speed||''):'',done:false})}
 return{key,name:e.name,mode:e.mode||'reps',min:e.min,max:e.max,inc:e.inc,label:e.label||'',rest:e.rest||rest,incline:e.incline||'',speed:e.speed||'',bench:(needsBench(e.name)||e.benchEnabled)?(e.bench||lastBench(key)||''):'',benchEnabled:!!e.benchEnabled||!!lastBench(key),sets};
}

function draw(cv,o){
 if(!cv)return;
 const dpr=Math.min(window.devicePixelRatio||1,3),W=cv.clientWidth,H=cv.clientHeight;if(!W)return;
 cv.width=W*dpr;cv.height=H*dpr;
 const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
 c.font='11px -apple-system,system-ui,sans-serif';
 const n=o.labels.length;
 if(!n){c.fillStyle='#667389';c.textAlign='center';c.fillText('Pas encore de données',W/2,H/2);return}
 const pl=34,pr=o.line?40:10,pt=16,pb=24,w=W-pl-pr,h=H-pt-pb,slot=w/n,xs=i=>pl+slot*(i+.5);
 let bmax=Math.max.apply(null,o.bars.vals.concat(o.band?[o.band[1]]:[0]))*1.18;if(!bmax)bmax=1;
 const yb=v=>pt+h-(v/bmax)*h;
 c.strokeStyle='#e3e9f4';c.lineWidth=1;c.fillStyle='#667389';c.textAlign='right';
 for(let k=0;k<=4;k++){const v=bmax*k/4,y=yb(v);c.beginPath();c.moveTo(pl,y);c.lineTo(pl+w,y);c.stroke();c.fillText(fmtK(v),pl-5,y+4)}
 if(o.band){
  c.fillStyle='rgba(22,163,74,.12)';c.fillRect(pl,yb(o.band[1]),w,Math.max(2,yb(o.band[0])-yb(o.band[1])));
  c.strokeStyle='rgba(22,163,74,.6)';c.setLineDash([4,4]);
  [o.band[0],o.band[1]].forEach(v=>{c.beginPath();c.moveTo(pl,yb(v));c.lineTo(pl+w,yb(v));c.stroke()});c.setLineDash([]);
 }
 const bw=Math.min(40,slot*.55);
 o.bars.vals.forEach((v,i)=>{
  c.fillStyle=o.bars.color;const x=xs(i)-bw/2,y=yb(v);c.fillRect(x,y,bw,Math.max(1,yb(0)-y));
  c.fillStyle='#fff';c.textAlign='center';if(yb(0)-y>16)c.fillText(fmtK(v),xs(i),yb(0)-5);
 });
 if(o.line&&o.line.vals.some(v=>v>0)){
  const vals=o.line.vals;let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(hi===lo){lo=Math.max(0,lo-5);hi=hi+5}const pv=(hi-lo)*.25;lo=Math.max(0,lo-pv);hi+=pv;
  const yl=v=>pt+h-((v-lo)/(hi-lo))*h;
  c.fillStyle=o.line.color;c.textAlign='left';
  for(let k=0;k<=2;k++){const v=lo+(hi-lo)*k/2;c.fillText(fmtK(v),pl+w+5,yl(v)+4)}
  c.strokeStyle=o.line.color;c.lineWidth=2.5;c.beginPath();
  vals.forEach((v,i)=>{i?c.lineTo(xs(i),yl(v)):c.moveTo(xs(i),yl(v))});c.stroke();
  vals.forEach((v,i)=>{c.fillStyle=o.line.color;c.beginPath();c.arc(xs(i),yl(v),4.5,0,7);c.fill();c.fillStyle='#14213d';c.textAlign='center';c.fillText(fmt(v),xs(i),yl(v)-9)});
 }
 c.fillStyle='#667389';c.textAlign='center';
 const step=Math.ceil(n/6);o.labels.forEach((l,i)=>{if(i%step===0||i===n-1)c.fillText(l,xs(i),H-7)});
}

function exerciseLibrary(){const m=new Map();BUILTIN.forEach(x=>m.set(slug(x.name),Object.assign({},x)));(S.customExercises||[]).forEach(x=>m.set(slug(x.name),Object.assign({},x)));S.programs.forEach(p=>p.ex.forEach(x=>m.set(slug(x.name),Object.assign({},x))));return Array.from(m.entries()).filter(([k])=>!(S.hiddenExercises||[]).includes(k)).map(([,v])=>v).sort((a,b)=>a.name.localeCompare(b.name,'fr'))}

function rExercises(){const list=exerciseLibrary();let h=`<h1 class="page-title settings"><span class="page-icon">🏋️</span><span class="page-name">EXERCICES</span></h1><p class="mu">Tous les exercices disponibles dans SPORT.</p><div class="card" style="padding:12px 14px;margin-bottom:10px"><input id="exerciseSearch" class="srch" type="search" placeholder="🔎 Rechercher un exercice…" autocomplete="off" autocapitalize="none"></div><div class="card" id="exerciseLibraryList" style="padding:4px 14px">`;if(!list.length)h+='<p class="mu" data-empty-exercises>Aucun exercice enregistré.</p>';list.forEach(e=>{const k=slug(e.name);h+=`<div class="erow exercise-library-row" data-search="${esc(slug(e.name))}"><div class="nm"><b>${esc(e.name)}</b><span class="mu sm">${e.mode==='cardio'?'Cardio':e.mode==='time'?'Durée':(e.sets||3)+' séries'}</span></div><button class="ib" data-act="libraryRename" data-key="${k}" style="color:#2563eb">✎</button><button class="ib" data-act="libraryDeleteAsk" data-key="${k}" style="background:#fff0f0;border-color:#efb4b4;color:#c62828">✕</button></div>`});return h+`<p id="exerciseSearchEmpty" class="mu" style="display:none;padding:12px 0">Aucun exercice trouvé.</p></div><button class="btn" data-act="libraryAdd" style="margin-top:14px">+ AJOUTER UN EXERCICE</button><button class="btn ghost" data-act="gotoSettings" style="margin-top:10px">‹ Retour aux paramètres</button>`}
window.ironRenameLibraryExercise=function(key){const n=$('#renameExerciseName').value.trim();if(!n)return toast('Donne un nom');const nk=slug(n);if(nk!==key&&exerciseLibrary().some(e=>slug(e.name)===nk))return toast('Ce nom existe déjà');(S.customExercises||[]).forEach(e=>{if(slug(e.name)===key)e.name=n});S.programs.forEach(p=>p.ex.forEach(e=>{if(slug(e.name)===key)e.name=n}));if(S.active)S.active.exos.forEach(e=>{if(e.key===key){e.key=nk;e.name=n}});S.sessions.forEach(a=>a.exos.forEach(e=>{if(e.key===key){e.key=nk;e.name=n}}));closeSheet();save();render();toast('Nom modifié')};
window.ironDeleteLibraryExercise=function(key){const e=exerciseLibrary().find(e=>slug(e.name)===key),x={type:'libraryExercise',label:'Exercice · '+(e?e.name:key),key,custom:[],programs:[],active:[]};(S.customExercises||[]).forEach((v,i)=>{if(slug(v.name)===key)x.custom.push({index:i,value:structuredClone(v)})});S.programs.forEach(p=>p.ex.forEach((v,i)=>{if(slug(v.name)===key)x.programs.push({programId:p.id,index:i,value:structuredClone(v)})}));if(S.active)S.active.exos.forEach((v,i)=>{if(v.key===key)x.active.push({activeId:S.active.id,index:i,value:structuredClone(v)})});trashPut(x);S.hiddenExercises=S.hiddenExercises||[];S.hiddenExercises.push(key);S.customExercises=(S.customExercises||[]).filter(v=>slug(v.name)!==key);S.programs.forEach(p=>p.ex=p.ex.filter(v=>slug(v.name)!==key));if(S.active)S.active.exos=S.active.exos.filter(v=>v.key!==key);closeSheet();save();render();toast('Exercice déplacé dans la corbeille')};
window.ironRestoreTrashItem=function(id){const i=S.appTrash.findIndex(x=>x.trashId===id);if(i<0)return;const t=S.appTrash[i];if(t.type==='libraryExercise'){S.hiddenExercises=S.hiddenExercises.filter(k=>k!==t.key);t.custom.forEach(x=>S.customExercises.splice(Math.min(x.index,S.customExercises.length),0,x.value));t.programs.forEach(x=>{const p=P(x.programId);if(p)p.ex.splice(Math.min(x.index,p.ex.length),0,x.value)});if(S.active)t.active.forEach(x=>{if(x.activeId===S.active.id)S.active.exos.splice(Math.min(x.index,S.active.exos.length),0,x.value)})}else if(t.type==='program')S.programs.splice(Math.min(t.index,S.programs.length),0,t.value);else if(t.type==='programExercise'){const p=P(t.programId);if(p)p.ex.splice(Math.min(t.index,p.ex.length),0,t.value)}else if(t.type==='activeExercise'){if(!S.active||S.active.id!==t.activeId)return toast('La séance d’origine n’est plus ouverte');S.active.exos.splice(Math.min(t.index,S.active.exos.length),0,t.value)}else if(t.type==='activeSet'){if(!S.active||S.active.id!==t.activeId||!S.active.exos[t.exerciseIndex])return toast('La séance d’origine n’est plus ouverte');S.active.exos[t.exerciseIndex].sets.splice(Math.min(t.index,S.active.exos[t.exerciseIndex].sets.length),0,t.value)}else if(t.type==='weight')S.weights.splice(Math.min(t.index,S.weights.length),0,t.value);S.appTrash.splice(i,1);save();render();toast('Élément restauré à son ancien emplacement')};
window.ironPurgeTrashItem=id=>{S.appTrash=S.appTrash.filter(x=>x.trashId!==id);save();render()};
function rTrash(){const ss=(S.trash||[]).slice().reverse(),it=(S.appTrash||[]).slice().reverse();let h=`<h1>Corbeille</h1><p class="mu">Toutes les suppressions récupérables sont regroupées ici.</p>`;if(!ss.length&&!it.length)return h+'<div class="card"><p class="mu">La corbeille est vide.</p></div>';if(it.length){h+='<h2>Éléments supprimés</h2><div class="card">';it.forEach(t=>h+=`<div class="erow"><div class="nm"><b>${esc(t.label)}</b></div><button class="ib" onclick="window.ironRestoreTrashItem('${t.trashId}')" style="color:#1677ff">↩</button><button class="ib" onclick="window.ironPurgeTrashItem('${t.trashId}')" style="color:#c62828">🗑</button></div>`);h+='</div>'}if(ss.length){h+='<h2>Séances supprimées</h2>';ss.forEach(x=>h+=`<div class="card"><div class="row sp"><b>${esc(up(x.name))}</b><div><button class="ib" onclick="window.ironRestoreSession('${x.id}')">↩</button><button class="ib" onclick="window.ironAskPurgeSession('${x.id}')">🗑</button></div></div></div>`)}return h}

const RECIPE_GUIDES={"Bowl skyr, fruits rouges & avoine":["Verser le skyr dans un bol et le détendre 20 à 30 secondes à la cuillère.","Ajouter les flocons d’avoine et les graines de chia, puis mélanger.","Ajouter les fruits rouges. S’ils sont surgelés, les laisser décongeler 10 à 15 min ou les réchauffer 1 à 2 min à feu doux puis les laisser tiédir.","Ajouter le miel juste avant de servir. Aucun temps de cuisson supplémentaire."],"Pancakes banane & avoine":["Écraser finement la banane, puis incorporer les œufs, les flocons d’avoine mixés et le lait. Laisser reposer la pâte 3 à 5 min.","Préchauffer une poêle antiadhésive 1 à 2 min à feu moyen-doux.","Verser de petits disques de pâte. Cuire environ 2 min sur la première face, jusqu’à formation de petites bulles et prise des bords.","Retourner puis cuire encore 1 à 2 min. Répéter jusqu’à épuisement de la pâte.","Servir avec le skyr et la cannelle."],"Overnight oats pomme cannelle":["Mélanger les flocons d’avoine, le lait, le skyr et les graines de chia pendant environ 30 secondes.","Couper la pomme en petits dés et l’incorporer avec la cannelle.","Fermer le récipient et laisser au réfrigérateur au minimum 4 h, idéalement une nuit.","Mélanger avant de manger. Ajouter 10 à 20 ml de lait si la texture est trop épaisse."],"Œufs brouillés, pain complet & tomate":["Couper la tomate et réserver.","Faire griller le pain complet 2 à 4 min au grille-pain ou à la poêle, selon le niveau de coloration souhaité.","Battre les œufs. Chauffer l’huile dans une poêle à feu doux à moyen pendant 30 secondes.","Verser les œufs et remuer régulièrement pendant environ 2 à 4 min, jusqu’à ce qu’ils soient pris mais encore moelleux.","Servir immédiatement avec le pain grillé, la tomate et les herbes."],"Poulet, riz & courgettes":["Rincer le riz. Le cuire dans de l’eau frémissante selon le temps indiqué sur le paquet, généralement autour de 10 à 12 min, puis égoutter.","Couper la courgette en rondelles ou demi-rondelles. La cuire à la poêle à feu moyen avec une partie de l’huile pendant 7 à 10 min, en remuant, jusqu’à ce qu’elle soit tendre et légèrement dorée.","Couper le poulet en morceaux réguliers. Chauffer la poêle, ajouter le reste d’huile puis cuire le poulet environ 6 à 10 min selon l’épaisseur, en le retournant régulièrement, jusqu’à cuisson complète à cœur.","Assaisonner avec ail, persil et paprika doux. Ajouter le jus de citron hors du feu.","Assembler riz, courgettes et poulet puis servir chaud."],"Bowl thon, riz, concombre & tomate":["Cuire le riz dans l’eau frémissante selon le paquet, généralement 10 à 12 min. Égoutter puis laisser tiédir 10 min.","Égoutter soigneusement le thon.","Couper le concombre et les tomates en morceaux.","Assembler le riz, le thon, le concombre et les tomates.","Mélanger l’huile d’olive et le jus de citron puis verser sur le bowl juste avant de servir."],"Wrap poulet crudités & sauce skyr":["Couper le poulet en lanières. Le cuire dans une poêle chaude environ 6 à 9 min en remuant, jusqu’à cuisson complète à cœur. Laisser reposer 2 min.","Couper la tomate et le concombre. Laver et essorer la salade.","Mélanger le skyr, le jus de citron et les herbes pendant 20 à 30 secondes.","Réchauffer la galette 20 à 30 secondes par face dans une poêle sèche pour l’assouplir.","Étaler la sauce, ajouter salade, tomate, concombre et poulet, puis rouler fermement."],"Poulet, semoule & légumes":["Couper les carottes en fines rondelles et la courgette en dés. Cuire les carottes 10 à 12 min dans l’eau frémissante ou à la vapeur, puis ajouter/cuissonner la courgette environ 6 à 8 min jusqu’à tendreté.","Porter le bouillon à ébullition. Le verser sur la semoule, couvrir 5 min puis égrainer à la fourchette.","Cuire le poulet dans une poêle avec l’huile environ 6 à 10 min selon l’épaisseur, jusqu’à cuisson complète à cœur.","Assembler semoule, légumes et poulet. Assaisonner et servir chaud."],"Saumon, quinoa & épinards":["Rincer le quinoa. Le cuire dans environ deux fois son volume d’eau pendant 12 à 15 min, jusqu’à absorption, puis laisser reposer 5 min couvert.","Préchauffer le four à 190 °C si cuisson au four. Cuire le saumon environ 10 à 14 min selon l’épaisseur, jusqu’à ce que la chair soit cuite à cœur et se détache facilement. À la poêle, compter environ 3 à 5 min par face à feu moyen.","Faire chauffer l’huile dans une grande poêle et cuire les épinards 2 à 4 min, juste le temps qu’ils tombent.","Assaisonner avec citron et aneth, puis servir avec le quinoa."],"Cabillaud citron, pommes de terre & haricots verts":["Couper les pommes de terre si nécessaire. Les cuire dans l’eau frémissante salée 15 à 20 min, jusqu’à ce que la pointe d’un couteau entre facilement.","Cuire les haricots verts à l’eau ou à la vapeur environ 8 à 12 min selon la texture souhaitée, puis égoutter.","Préchauffer le four à 190 °C. Déposer le cabillaud dans un plat, ajouter citron et herbes puis cuire environ 10 à 15 min selon l’épaisseur, jusqu’à cuisson à cœur.","Ajouter l’huile d’olive sur les légumes au moment de servir."],"Dinde, patate douce & haricots verts":["Préchauffer le four à 200 °C. Couper la patate douce en cubes de taille régulière. Mélanger avec une partie de l’huile puis enfourner 25 à 35 min, en remuant à mi-cuisson.","Cuire les haricots verts 8 à 12 min à l’eau frémissante ou à la vapeur.","Cuire l’escalope de dinde dans une poêle chaude 4 à 6 min par face selon son épaisseur, jusqu’à cuisson complète à cœur.","Laisser reposer la dinde 2 min puis servir avec les légumes et le jus de citron."],"Crevettes, riz & courgettes":["Cuire le riz dans l’eau frémissante selon le paquet, généralement 10 à 12 min, puis égoutter.","Couper la courgette et la cuire avec l’huile et l’ail à feu moyen environ 7 à 10 min.","Ajouter les crevettes décortiquées. Si elles sont déjà cuites, les réchauffer 2 à 3 min ; si elles sont crues, poursuivre environ 3 à 5 min jusqu’à cuisson complète.","Ajouter le citron hors du feu puis servir avec le riz."],"Skyr aux fruits rouges":["Verser le skyr dans un bol.","Ajouter les fruits rouges. Pour des fruits surgelés, les laisser décongeler 10 à 15 min avant utilisation.","Concasser grossièrement les amandes.","Ajouter miel et amandes juste avant de servir. Aucune cuisson nécessaire."],"Banane cacao façon crème":["Couper puis écraser ou mixer la banane pendant 30 à 60 secondes.","Ajouter le skyr, le cacao non sucré et le lait.","Mixer ou fouetter encore 30 secondes jusqu’à obtenir une crème homogène.","Réserver 15 à 30 min au réfrigérateur pour une texture plus ferme, ou servir immédiatement."],"Pomme chaude cannelle & skyr":["Éplucher la pomme si souhaité puis la couper en dés de 1 à 2 cm.","Mettre les dés dans une petite casserole avec l’eau et la cannelle. Couvrir et cuire à feu doux 7 à 10 min, en remuant une ou deux fois, jusqu’à ce que la pomme soit tendre.","Laisser tiédir 3 à 5 min.","Servir sur le skyr et ajouter le miel au dernier moment."],"Verrine fraise, skyr & avoine":["Rincer les fraises puis les couper en morceaux.","Déposer une première couche de skyr dans un verre.","Ajouter une couche de fraises et une partie des flocons d’avoine.","Répéter les couches puis terminer par le miel. Aucune cuisson nécessaire."],"Tartines fromage frais, œuf & tomate":["Faire griller le pain complet 2 à 4 min au grille-pain ou à la poêle.","Pour les œufs : les cuire dans l’eau frémissante 6 à 7 min pour un jaune encore tendre, ou 9 à 10 min pour des œufs durs. Les refroidir puis les écaler.","Couper la tomate en tranches.","Tartiner le fromage frais sur le pain, ajouter tomate puis œufs tranchés."],"Porridge banane vanille":["Verser le lait et les flocons d’avoine dans une petite casserole.","Chauffer à feu moyen-doux 5 à 7 min en remuant fréquemment jusqu’à épaississement.","Écraser la moitié de la banane et l’incorporer durant la dernière minute de cuisson.","Retirer du feu, laisser reposer 1 à 2 min, puis ajouter le skyr, le reste de banane et la vanille."],"Skyr, poire & amandes":["Couper la poire en petits morceaux.","Verser le skyr dans un bol et ajouter les flocons d’avoine.","Ajouter la poire puis les amandes grossièrement concassées.","Mélanger juste avant de déguster. Aucune cuisson nécessaire."],"Salade poulet, pommes de terre & haricots verts":["Cuire les pommes de terre 15 à 20 min dans l’eau frémissante, puis laisser tiédir.","Cuire les haricots verts 8 à 12 min puis les refroidir rapidement sous l’eau froide et égoutter.","Cuire le poulet à la poêle environ 6 à 10 min selon l’épaisseur, jusqu’à cuisson complète à cœur. Laisser reposer 2 min puis couper.","Couper les tomates. Assembler tous les ingrédients et assaisonner avec huile et citron."],"Salade de pâtes, thon & concombre":["Cuire les pâtes dans l’eau bouillante selon le temps du paquet, généralement 8 à 11 min. Égoutter puis refroidir.","Égoutter le thon. Couper concombre et tomates.","Mélanger le skyr avec le jus de citron pendant 20 secondes pour obtenir la sauce.","Assembler les pâtes refroidies, le thon et les légumes puis incorporer la sauce."],"Omelette jambon, épinards & pommes de terre":["Cuire les pommes de terre dans l’eau frémissante 15 à 20 min puis les couper en morceaux.","Faire tomber les épinards dans une poêle avec une partie de l’huile pendant 2 à 4 min.","Ajouter le jambon coupé et réchauffer 1 min.","Battre les œufs, verser dans la poêle et cuire à feu moyen-doux 4 à 6 min, jusqu’à ce que l’omelette soit prise.","Servir avec les pommes de terre."],"Bœuf maigre, semoule & courgettes":["Porter le bouillon à ébullition, le verser sur la semoule, couvrir 5 min puis égrainer.","Couper la courgette et la cuire à la poêle 7 à 10 min jusqu’à tendreté.","Chauffer une poêle avec l’huile puis saisir le bœuf 2 à 4 min par face selon l’épaisseur et la cuisson souhaitée.","Laisser reposer la viande 2 à 3 min puis servir avec semoule et courgettes."],"Poulet citron, quinoa & carottes":["Rincer le quinoa puis le cuire 12 à 15 min dans environ deux fois son volume d’eau. Laisser reposer 5 min couvert.","Couper les carottes et les cuire à la vapeur ou dans l’eau frémissante 10 à 15 min selon l’épaisseur.","Cuire le poulet à la poêle avec l’huile environ 6 à 10 min selon l’épaisseur, jusqu’à cuisson complète à cœur.","Ajouter le jus de citron hors du feu et servir avec quinoa et carottes."],"Steak haché 5 %, patate douce & courgette":["Préchauffer le four à 200 °C. Couper la patate douce en cubes, ajouter une partie de l’huile puis cuire 25 à 35 min en remuant à mi-cuisson.","Couper la courgette et la cuire à la poêle 7 à 10 min.","Cuire le steak haché dans une poêle chaude environ 3 à 5 min par face selon son épaisseur, jusqu’à cuisson souhaitée et sûre à cœur.","Laisser reposer 2 min puis servir avec les légumes."],"Fromage blanc, pomme & cannelle":["Couper la pomme en petits dés ou en fines lamelles.","Verser le fromage blanc dans un bol.","Ajouter la pomme et la cannelle.","Ajouter le miel juste avant de servir. Aucune cuisson nécessaire."],"Mousse légère chocolat & skyr":["Mélanger le skyr et le cacao pendant environ 30 secondes.","Ajouter le lait progressivement puis le miel et fouetter encore 30 à 60 secondes jusqu’à ce que la préparation soit lisse.","Réserver au réfrigérateur au moins 30 min pour raffermir la texture.","Remuer rapidement avant de servir."],"Compote pomme-banane maison":["Éplucher les fruits si souhaité. Couper la pomme en petits dés et la banane en rondelles.","Mettre la pomme et l’eau dans une casserole. Couvrir et cuire à feu doux 8 à 10 min.","Ajouter la banane puis poursuivre la cuisson 4 à 6 min, jusqu’à ce que les fruits soient très tendres.","Écraser à la fourchette pour une compote avec morceaux ou mixer 20 à 30 secondes pour une texture lisse.","Laisser tiédir puis conserver au frais."]};

let recipeFilter='Petit déjeuner',recipeOpen=null,recipeServings=1;
function scaleIngredient(txt,n){return String(txt).replace(/(\d+(?:[.,]\d+)?)/g,m=>{const v=Number(m.replace(',','.'));if(!Number.isFinite(v))return m;const x=v*n;return Number.isInteger(x)?String(x):String(Math.round(x*10)/10).replace('.',',')})}
function rRecipes(){
 if(recipeOpen!=null){const r=RECIPES[recipeOpen];return `<button class="btn ghost recipe-back" data-act="recipeBack">‹ Retour aux recettes</button><article class="recipe-detail"><h1>${esc(r.n)}</h1><div class="recipe-meta"><span>${esc(r.cat)}</span><span>${r.time}</span><span>${r.kcal}</span><span>Protéines : ≈ ${r.protein} g / personne</span></div><div class="servings"><button data-act="servingsMinus" aria-label="Retirer une personne">−</button><b>${recipeServings} ${recipeServings>1?'personnes':'personne'}</b><button data-act="servingsPlus" aria-label="Ajouter une personne">+</button></div><div class="servings-hint">Les quantités ci-dessous s’adaptent automatiquement. Protéines totales : ≈ ${r.protein*recipeServings} g (${r.protein} g par personne).</div><div class="card recipe-section"><h2>Ingrédients & quantités</h2><ul>${r.ing.map(x=>`<li>${esc(scaleIngredient(x,recipeServings))}</li>`).join('')}</ul></div><div class="card recipe-section"><h2>Préparation détaillée</h2><ol class="recipe-steps-detailed">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="recipe-note" style="margin-top:14px">Les calories sont des estimations. Les quantités peuvent être adaptées à tes besoins énergétiques et à ta faim.</div></article>`}
 const cats=['Petit déjeuner','Déjeuner','Repas','Dessert'];const list=RECIPES.map((r,i)=>({r,i})).filter(x=>x.r.cat===recipeFilter);return `<h1 class="page-title recipes"><span class="page-icon">🍽️</span><span class="page-name">RECETTES</span></h1><p class="mu">Choisis une catégorie puis ouvre une recette pour afficher la fiche complète.</p><div class="recipe-filters">${cats.map(c=>`<button class="recipe-filter ${c===recipeFilter?'on':''}" data-act="recipeFilter" data-cat="${esc(c)}">${esc(c).toUpperCase()}</button>`).join('')}</div><div class="recipe-grid">${list.map(x=>`<article class="card recipe recipe-card" data-act="recipeOpen" data-ri="${x.i}"><div class="recipe-body"><h2 style="margin:0">${esc(x.r.n)}</h2><div class="recipe-meta"><span>${x.r.time}</span><span>${x.r.kcal}</span><span>≈ ${x.r.protein} g protéines</span></div><p class="mu sm">Touchez pour ouvrir la recette complète ›</p></div></article>`).join('')}</div>`}

/* ================= Chrono & repos ================= */
let restEnd=0,restTot=0,restDone=false;
function startRest(sec){restEnd=Date.now()+sec*1000;restTot=sec;restDone=false;$('#rest').className='show';tickRest()}
function tickRest(){
 const el=$('#rest');if(!restEnd){el.className='';return}
 const left=Math.ceil((restEnd-Date.now())/1000);
 if(left>0){$('#restT').textContent='✅ Série validée · REPOS '+mmss(left);el.className='show'}
 else{
  if(!restDone){restDone=true;$('#restT').textContent='Go ! 💪';el.className='show go';try{navigator.vibrate&&navigator.vibrate([250,100,250])}catch(e){}beep();setTimeout(()=>{if(restDone){restEnd=0;el.className=''}},4000)}
 }
}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.3)}catch(e){}}
function tick(){
 const c=$('#chrono');
 if(c&&S.active){c.textContent=mmss((Date.now()-S.active.start)/1000)}
 const w=S.active&&S.active.warm;
 if(w&&w.tEnd){
  const left=Math.ceil((w.tEnd-Date.now())/1000),el=$('#wTimer');
  if(left>0){if(el)el.textContent=mmss(left)}
  else{w.done=true;w.tEnd=0;save();try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}beep();toast('Échauffement terminé 🔥');if(S.ui.tab==='sess')render()}
 }
 tickRest();
}
setInterval(tick,500);
let wl=null;
async function wake(){try{if(S.active&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});

function exForm(title,e,extra,cb){
 const d=e||{name:'',mode:'reps',sets:3,min:8,max:12,inc:2.5,label:'',rest:75,incline:'',speed:''};
 openSheet(`<h3>${title}</h3>
 <label class="fl">Nom ou zone musculaire<input id="fN" value="${esc(d.name)}" placeholder="ex : PECS, JAMBES, BRAS, DOS…" autocomplete="off"></label>
 <div id="fSuggest" class="ex-suggest"></div>
 <label class="fl">Type<select id="fM"><option value="reps">Charge + répétitions</option><option value="time">Durée (secondes)</option><option value="cardio">Cardio</option></select></label>
 <div id="strengthFields" class="type-fields"></div>
 <div id="cardioFields" class="type-fields field-hidden">
  <div class="row3 cardio-grid"><label class="fl">Minutes<input id="fCardioMin" inputmode="decimal" value="${d.mode==='cardio'?(d.min||10):10}"></label><label class="fl">Inclinaison<input id="fIncline" inputmode="decimal" placeholder="ex : 8" value="${d.incline||''}"></label><label class="fl">Vitesse (km/h)<input id="fSpeed" inputmode="decimal" placeholder="ex : 5,5" value="${d.speed||''}"></label></div>
  <p class="mu sm" style="margin:-4px 0 6px">Pour un cardio sans inclinaison ou vitesse (vélo, rameur…), laisse la case concernée vide.</p>
 </div>
 ${extra||''}<div style="height:8px"></div><button class="btn" data-act="sheetSave">Enregistrer</button>`);
 $('#fM').value=d.mode||'reps';
 const refreshType=()=>{const mode=$('#fM').value,isCardio=mode==='cardio';$('#strengthFields').classList.toggle('field-hidden',isCardio);$('#cardioFields').classList.toggle('field-hidden',!isCardio)};
 refreshType();$('#fM').addEventListener('change',refreshType);
 const showSuggest=q=>{const box=$('#fSuggest'),k=slug(q||'');if(!k){box.innerHTML='';return}const zoneAliases={pec:['pecs','poitrine'],pecs:['pecs','poitrine'],poitrine:['pecs','poitrine'],jambe:['jambes'],jambes:['jambes'],bras:['bras','biceps','triceps'],biceps:['biceps'],triceps:['triceps'],dos:['dos'],epaule:['epaules'],epaules:['epaules'],abdo:['abdos','gainage'],abdos:['abdos','gainage'],fessier:['fessiers'],fessiers:['fessiers'],mollet:['mollets'],mollets:['mollets'],ischio:['ischios'],ischios:['ischios'],quadriceps:['quadriceps'],cardio:['cardio']};const zones=zoneAliases[k]||[k];const list=BUILTIN.filter(x=>zones.some(z=>(x.zones||[]).includes(z))||slug(x.name).includes(k)).slice(0,18);box.innerHTML=list.length?list.map(x=>`<div class="pick ex-form-pick" data-name="${esc(x.name)}"><b>${esc(x.name)}</b><span class="mu sm">${x.mode==='cardio'?'cardio':(x.zones||[]).join(' · ')}</span></div>`).join(''):'';box.querySelectorAll('.ex-form-pick').forEach(el=>el.addEventListener('click',()=>{const x=BUILTIN.find(v=>v.name===el.dataset.name);if(!x)return;$('#fN').value=x.name;$('#fM').value=x.mode;d.sets=x.sets;d.min=x.min;d.max=x.max;d.inc=x.inc;$('#fCardioMin').value=x.min||10;box.innerHTML='';refreshType()}))};
 $('#fN').addEventListener('input',ev=>showSuggest(ev.target.value));
 sheetCb=()=>{
  const name=$('#fN').value.trim();if(!name){toast('Donne un nom à l\'exercice');return false}
  const mode=$('#fM').value,rest=d.rest||75;let sets=d.sets||3,min=d.min||8,max=d.max||12,inc=d.inc||2.5,incline='',speed='';
  if(mode==='cardio'){min=Math.max(1,num($('#fCardioMin').value)||10);max=min;incline=$('#fIncline').value.trim();speed=$('#fSpeed').value.trim()}
  else{if(mode==='time'){min=d.mode==='time'?(d.min||30):30;max=d.mode==='time'?(d.max||60):60;inc=0}else{sets=d.sets||3;min=d.min||8;max=d.max||12;inc=d.inc||2.5}}
  return cb({name,mode,sets,min,max,inc,label:d.label||'',rest,incline,speed})!==false;
 };
}
function candidates(){
 const m=new Map();
 BUILTIN.forEach(b=>m.set(slug(b.name),b));
  (S.customExercises||[]).forEach(b=>m.set(slug(b.name),b));
 historyKeys().forEach(h=>m.set(h.key,{name:h.name,mode:h.mode,sets:h.sets||3,min:h.min,max:h.max,inc:h.inc}));
 S.programs.forEach(p=>p.ex.forEach(e=>m.set(slug(e.name),{name:e.name,mode:e.mode,sets:e.sets,min:e.min,max:e.max,inc:e.inc,label:e.label})));

function pickHTML(q){
 q=slug(q||'');
 const r=pickList.map((m,i)=>({m,i})).filter(x=>!q||slug(x.m.name).includes(q));
 return r.length?r.map(x=>`<div class="pick" data-act="pick" data-i="${x.i}"><b>${esc(x.m.name)}</b><span class="mu sm">${x.m.mode==='cardio'?'cardio':x.m.sets+' × '+(x.m.min===x.m.max?x.m.max:x.m.min+'-'+x.m.max)}</span></div>`).join(''):'<p class="mu">Aucun résultat. Crée-le ci-dessous.</p>';
}
function openPicker(){
 pickList=candidates();
 openSheet(`<h3>Ajouter un exercice</h3><input id="pickQ" class="srch" placeholder="Rechercher…"><div id="pickL">${pickHTML('')}</div><div style="height:10px"></div><button class="btn ghost" data-act="pickNew">+ Créer un nouvel exercice</button>`);
}
function progSelectHTML(){return `<label class="fl">L'ajouter aussi à un programme ?<select id="fP"><option value="">Non, seulement cette séance</option>${S.programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>`}
function progForm(p){
 const used=S.programs.map(q=>q.color),d=p||{name:'',day:null,rest:75,tip:'',color:PAL.find(c=>!used.includes(c))||PAL[S.programs.length%PAL.length]};
 let fCol=d.color;
 openSheet(`<h3>${p?'Modifier le programme':'Nouveau programme'}</h3>
 <label class="fl">Nom<input id="gN" value="${esc(d.name)}"></label>
 <div class="fl">Couleur dans le graphique</div><div class="sws" id="sws">${PAL.map(c=>`<button type="button" class="sw ${c===fCol?'on':''}" data-c="${c}" style="background:${c}" aria-label="Couleur ${c}"></button>`).join('')}</div>
 <button class="btn" data-act="sheetSave" style="margin-top:14px">Enregistrer</button>`);
 sheetCb=()=>{
  const name=up($('#gN').value.trim());if(!name){toast('Donne un nom');return false}
  const rest=d.rest||75;
  if(p){p.name=name;p.day=null;p.rest=rest;p.color=fCol}
  else S.programs.push({id:uid(),name,day:null,rest,tip:'',color:fCol,ex:[]});
 };
 $('#sws').addEventListener('click',ev=>{const b=ev.target.closest('.sw');if(!b)return;fCol=b.dataset.c;document.querySelectorAll('#sws .sw').forEach(x=>x.classList.toggle('on',x===b))});
}

/* ================= Actions ================= */
const P=id=>S.programs.find(p=>p.id===id);
function download(name,text){
 const b=new Blob([text],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500);
}
function finish(){
 const a=S.active;
 const exos=a.exos.map(e=>({key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,bench:e.bench||'',benchEnabled:!!e.benchEnabled,sets:e.sets.filter(s=>s.done).map(s=>({w:num(s.w),r:num(s.r)}))})).filter(e=>e.sets.length);
 if(!exos.length){if(confirm('Aucune série validée. Quitter sans enregistrer ?')){S.active=null;restEnd=0;save();go('dash')}return}
 const tot=a.exos.reduce((x,e)=>x+e.sets.length,0),dn=a.exos.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0);
 if(dn<tot&&!confirm((tot-dn)+' série(s) non validée(s) seront ignorées. Terminer ?'))return;
 S.sessions.push({id:uid(),date:todayISO(),progId:a.progId,name:a.name,dur:a.dur,minutes:Math.max(1,Math.round((Date.now()-a.start)/60000)),warm:a.warm&&a.warm.done?{min:a.warm.min,incline:a.warm.incline,speed:a.warm.speed}:null,exos});
 S.active=null;restEnd=0;if(wl){try{wl.release()}catch(e){}wl=null}
 S.ui.exKey=exos[0].key;save();toast('Séance enregistrée 💪');go('dash');
}
window.ironRemoveExercise=function(i){if(!S.active||!S.active.exos[i])return;const e=S.active.exos[i];trashPut({type:'activeExercise',label:'Exercice de séance · '+e.name,activeId:S.active.id,index:i,value:structuredClone(e)});S.active.exos.splice(i,1);save();render();toast('Exercice déplacé dans la corbeille')};
window.ironStop=function(){if(!S.active)return;S.active=null;restEnd=0;if(wl){try{wl.release()}catch(e){}wl=null}save();render();go('dash');toast('Séance arrêtée sans enregistrement')};
window.ironFinish=function(){if(!S.active)return;const a=S.active;const exos=a.exos.map(e=>({key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,bench:e.bench||'',benchEnabled:!!e.benchEnabled,sets:e.sets.filter(x=>x.done||num(x.w)>0||num(x.r)>0).map(x=>({w:num(x.w),r:num(x.r),incline:x.incline==null?'':x.incline,speed:x.speed==null?'':x.speed}))})).filter(e=>e.sets.length);S.sessions.push({id:uid(),date:todayISO(),progId:a.progId,name:a.name,dur:a.dur,minutes:Math.max(1,Math.round((Date.now()-a.start)/60000)),warm:a.warm&&a.warm.done?{min:a.warm.min,incline:a.warm.incline,speed:a.warm.speed}:null,exos});S.active=null;restEnd=0;if(wl){try{wl.release()}catch(e){}wl=null}if(exos.length)S.ui.exKey=exos[0].key;save();render();go('dash');toast('Séance enregistrée 💪')};
function act(a,d){
 switch(a){
  case 'recipeFilter':recipeFilter=d.cat||'Petit déjeuner';recipeOpen=null;render();break;
  case 'recipeOpen':recipeOpen=Number(d.ri);recipeServings=1;render();window.scrollTo(0,0);break;
  case 'recipeBack':recipeOpen=null;render();window.scrollTo(0,0);break;
  case 'servingsMinus':recipeServings=Math.max(1,recipeServings-1);render();break;
  case 'servingsPlus':recipeServings=Math.min(12,recipeServings+1);render();break;
  case 'closeSheet':closeSheet();break;
  case 'sheetSave':if(sheetCb){const r=sheetCb();if(r!==false){closeSheet();save();render()}}break;
  case 'gotoSess':go('sess');break;
  case 'gotoW':go('weight');break;
  case 'gotoTrash':go('trash');break;
  case 'gotoHist':go('hist');break;
  case 'gotoExercises':go('exercises');break;case 'gotoSettings':go('settings');break;
  case 'libraryRename':{const e=exerciseLibrary().find(x=>slug(x.name)===d.key);openSheet(`<h3>Modifier le nom</h3><label class="fl">Nom<input id="renameExerciseName" value="${esc(e.name)}"></label><button class="btn" onclick="window.ironRenameLibraryExercise('${d.key}')">ENREGISTRER</button>`);break}
  case 'libraryAdd':exForm('Ajouter un exercice',null,'',o=>{S.customExercises.push(Object.assign({id:uid()},o));S.hiddenExercises=S.hiddenExercises.filter(k=>k!==slug(o.name))});break;
  case 'libraryDeleteAsk':{const e=exerciseLibrary().find(x=>slug(x.name)===d.key);openSheet(`<h3>Supprimer l’exercice</h3><p>Supprimer <b>${esc(e.name)}</b> ?</p><button class="btn danger" onclick="window.ironDeleteLibraryExercise('${d.key}')">SUPPRIMER</button>`);break}
  case 'pie':S.ui.pie=d.m;save();render();break;
  case 'calPrev':shiftMonth(-1);break;case 'calNext':shiftMonth(1);break;
  case 'toggleWarm':{const card=document.querySelector('[data-warm-card]');if(card){card.classList.toggle('warm-collapsed');const f=card.querySelector('.warm-fold');if(f)f.textContent=card.classList.contains('warm-collapsed')?'⌄':'⌃'}break}
  case 'wu':{const w=S.active.warm,dl=parseFloat(d.d);
   if(d.k==='incline')w.incline=Math.min(16,Math.max(1,Math.round(w.incline+dl)));
   else if(d.k==='speed')w.speed=Math.min(20,Math.max(0.5,Math.round((w.speed+dl)*2)/2));
   else if(!w.tEnd)w.min=Math.min(60,Math.max(1,Math.round(w.min+dl)));
   save();render();break}
  case 'wuStart':{const w=S.active.warm;w.tEnd=Date.now()+w.min*60000;w.done=false;save();render();break}
  case 'wuStop':S.active.warm.tEnd=0;save();render();break;
  case 'wuDone':{const w=S.active.warm;w.done=!w.done;w.tEnd=0;save();render();break}
  case 'wAdd':if(addWeight($('#wKg').value,$('#wDate').value)){toast('Poids enregistré');render()}break;
  case 'wAddDash':if(addWeight($('#wDashIn').value,todayISO())){toast('Poids enregistré');render()}break;
  case 'wDel':if(confirm('Supprimer cette pesée ?')){const i=S.weights.findIndex(x=>x.id===d.id);if(i>=0){trashPut({type:'weight',label:'Pesée · '+fmt(S.weights[i].kg)+' kg',index:i,value:structuredClone(S.weights[i])});S.weights.splice(i,1);save();render()}}break;
  case 'wRange':S.ui.wRange=d.m;save();render();break;
  case 'wGoal':{const v=num($('#wGoal').value);S.goalW=v>=20&&v<=400?Math.round(v*10)/10:null;save();render();toast(S.goalW?'Objectif enregistré':'Objectif retiré');break}
  case 'prepProg':S.ui.progId=d.id;go('sess');break;
  case 'selProg':S.ui.progId=d.id;save();render();break;
  case 'selDur':S.ui.dur=+d.m;save();render();break;
  case 'start':{
   const p=selProg();
   const dur=S.ui.dur,rest=p?(p.rest||75):75;
   const plan=p?buildPlan(p,dur).items:[];
   const lw=lastWarm(S.sessions);
   S.active={id:uid(),progId:p?p.id:'free',name:p?up(p.name):'SÉANCE LIBRE',dur:p?dur:0,start:Date.now(),rest,warm:{min:10,incline:lw.incline,speed:lw.speed,done:false,tEnd:0},exos:plan.map(i=>newExo(i,i.planned,rest))};
   save();wake();render();window.scrollTo(0,0);
   if(!p)openPicker();
   break}
  case 'enableBench':S.active.exos[+d.i].benchEnabled=true;save();render();break;
  case 'exRest':{const e=S.active.exos[+d.i];openSheet(`<h3>Repos pour ${esc(e.name)}</h3><div class="chips">${[30,45,60,75,90,120,180].map(v=>`<button class="chip ${e.rest===v?'on':''}" data-act="setExRest" data-i="${d.i}" data-v="${v}">${v} s</button>`).join('')}</div>`);break}
  case 'setExRest':S.active.exos[+d.i].rest=+d.v;closeSheet();save();render();toast('Repos réglé à '+d.v+' s');break;
  case 'chk':{
   const e=S.active.exos[+d.i],s=e.sets[+d.j];s.done=!s.done;
   if(s.done){
    if(num(s.r)<=0){s.done=false;toast(e.mode==='reps'?'Saisis le nombre de reps':e.mode==='time'?'Saisis la durée':'Saisis les minutes');break}
    const more=e.sets.some(x=>!x.done)||S.active.exos.some((x,k)=>k>+d.i&&x.sets.some(y=>!y.done));
    if(e.mode!=='cardio'&&more)startRest(e.rest||75);
   }
   save();render();break}
  case 'toggleExercise':{const card=document.querySelector('.ex[data-ex-card=\"'+d.i+'\"]');if(card){card.classList.toggle('exercise-collapsed');const f=card.querySelector('.fold-indicator');if(f)f.textContent=card.classList.contains('exercise-collapsed')?'⌄':'⌃'}break}
  case 'addSet':{const e=S.active.exos[+d.i];const l=e.sets[e.sets.length-1]||{w:'',r:e.min};e.sets.push({w:l.w,r:l.r,incline:l.incline||'',speed:l.speed||'',done:false});save();render();break}
  case 'delSet':{const e=S.active.exos[+d.i];if(e.sets.length>1)e.sets.pop();save();render();break}
  case 'delOneSet':{const ei=+d.i,e=S.active.exos[ei],j=+d.j;if(e.sets.length<=1){toast('Au moins une série est nécessaire');break}trashPut({type:'activeSet',label:'Série '+(j+1)+' · '+e.name,activeId:S.active.id,exerciseIndex:ei,index:j,value:structuredClone(e.sets[j])});e.sets.splice(j,1);save();render();break}
  case 'rmEx':if(confirm('Retirer cet exercice de la séance ?')){S.active.exos.splice(+d.i,1);save();render()}break;
  case 'addEx':openPicker();break;
  case 'pick':{const m=pickList[+d.i];S.active.exos.push(newExo(m,m.mode==='cardio'?1:m.sets,S.active.rest));closeSheet();save();render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);break}
  case 'pickNew':exForm('Nouvel exercice',null,progSelectHTML(),o=>{
   S.active.exos.push(newExo(o,o.mode==='cardio'?1:o.sets,S.active.rest));
   const pid=$('#fP').value;if(pid&&P(pid))P(pid).ex.push(Object.assign({id:uid()},o));
  });break;
  case 'finish':finish();break;
  case 'abandon':if(confirm('Abandonner la séance en cours ? Rien ne sera enregistré.')){S.active=null;restEnd=0;save();render()}break;
  case 'restP':restEnd+=30000;restDone=false;tickRest();break;
  case 'restRestart':startRest(restTot||75);break;
  case 'restSkip':restEnd=0;$('#rest').className='';break;
  case 'toggleProg':{const card=document.querySelector('[data-prog-card=\"'+d.id+'\"]');if(card){card.classList.toggle('prog-collapsed');const f=card.querySelector('.prog-fold');if(f)f.textContent=card.classList.contains('prog-collapsed')?'⌄':'⌃'}break}
  case 'editProg':progForm(P(d.id));break;
  case 'newProg':progForm(null);break;
  case 'delProgDirect':{const p=P(d.id);if(!p)break;openSheet(`<h3>Supprimer le programme</h3><p>Supprimer <b>${esc(up(p.name))}</b> ?</p><p class="mu sm">Les anciennes séances de l’historique seront conservées.</p><div class="row" style="margin-top:14px"><button class="btn ghost" type="button" onclick="event.preventDefault();event.stopPropagation();closeSheet()">Annuler</button><button class="btn danger" type="button" onclick="event.preventDefault();event.stopPropagation();window.deleteProgramNow('${p.id}')">Supprimer</button></div>`);break}
  case 'delProg':if(confirm('Supprimer ce programme ? (l\'historique est conservé)'))window.deleteProgramNow(d.id);break;
  case 'exAdd':exForm('Nouvel exercice',null,'',o=>{P(d.p).ex.push(Object.assign({id:uid()},o));if(!S.customExercises.some(x=>slug(x.name)===slug(o.name)))S.customExercises.push(Object.assign({id:uid()},o))});break;
  case 'exEdit':{const p=P(d.p),e=p.ex[+d.i];exForm('Modifier l\'exercice',e,'',o=>{Object.assign(e,o)});break}
  case 'exDel':if(confirm('Supprimer cet exercice du programme ?')){const p=P(d.p),i=+d.i,e=p.ex[i];trashPut({type:'programExercise',label:'Exercice · '+e.name+' · '+p.name,programId:p.id,index:i,value:structuredClone(e)});p.ex.splice(i,1);save();render()}break;
  case 'exUp':{const l=P(d.p).ex,i=+d.i;if(i>0){[l[i-1],l[i]]=[l[i],l[i-1]];save();render()}break}
  case 'exDn':{const l=P(d.p).ex,i=+d.i;if(i<l.length-1){[l[i+1],l[i]]=[l[i],l[i+1]];save();render()}break}
  case 'duplicateSess':{const old=S.sessions.find(x=>x.id===d.id);if(!old)break;const lw=lastWarm(S.sessions);S.active={id:uid(),progId:old.progId,name:old.name,dur:old.dur||0,start:Date.now(),rest:75,warm:{min:old.warm?old.warm.min:10,incline:old.warm?old.warm.incline:lw.incline,speed:old.warm?old.warm.speed:lw.speed,done:false,tEnd:0},exos:old.exos.map(e=>({key:e.key,name:e.name,mode:e.mode,min:e.min,max:e.max,inc:e.inc,label:e.label||'',rest:e.rest||75,sets:e.sets.map(()=>({w:'',r:'',done:false}))}))};save();go('sess');toast('Séance dupliquée');break}
  case 'trashSess':{const i=S.sessions.findIndex(x=>x.id===d.id);if(i>=0){S.trash=S.trash||[];S.trash.push(S.sessions[i]);S.sessions.splice(i,1);save();render();toast('Séance déplacée dans la corbeille')}}break;
  case 'restoreSess':{const i=(S.trash||[]).findIndex(x=>x.id===d.id);if(i>=0){S.sessions.push(S.trash[i]);S.trash.splice(i,1);save();render();toast('Séance restaurée')}}break;
  case 'purgeSess':if(confirm('Supprimer définitivement cette séance ? Cette action est irréversible.')){S.trash=(S.trash||[]).filter(x=>x.id!==d.id);save();render();toast('Séance supprimée définitivement')}break;
  case 'exportF':download('ironlog-sauvegarde-'+todayISO()+'.json',JSON.stringify(S));toast('Sauvegarde exportée');break;
  case 'exportC':{const t=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Sauvegarde copiée'),()=>showBackup(t));else showBackup(t);break}
  case 'importO':openSheet(`<h3>Importer une sauvegarde</h3><input type="file" id="impF" accept=".json,application/json"><p class="mu sm" style="margin:10px 0 4px">ou colle le contenu ici :</p><textarea id="impT"></textarea><button class="btn" style="margin-top:10px" data-act="importGo">Importer</button><p class="mu sm">Attention : remplace toutes les données actuelles.</p>`);break;
  case 'importGo':{
   const f=$('#impF').files[0];
   const apply=t=>{try{const o=JSON.parse(t);if(!o.programs||!o.sessions)throw 0;S=o;S.ui=Object.assign({tab:'settings',progId:null,dur:60,exKey:null},S.ui||{});save();closeSheet();render();toast('Sauvegarde importée')}catch(e){toast('Fichier invalide')}};
   if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)}else apply($('#impT').value);
   break}
  case 'reset':window.ironAskReset();break;
 }
}
function showBackup(t){openSheet(`<h3>Sauvegarde</h3><p class="mu sm">Copie ce texte et garde-le (notes, mail…).</p><textarea id="bk" readonly>${esc(t)}</textarea>`);setTimeout(()=>{const x=$('#bk');if(x){x.select()}},50)}

// Gestion universelle des boutons, compatible Safari/iOS et ouverture depuis Fichiers.
let lastButton=null,lastButtonAt=0;
function buttonTarget(ev,selector){
 const path=ev.composedPath?ev.composedPath():[];
 for(const n of path)if(n&&n.matches&&n.matches(selector))return n;
 return ev.target&&ev.target.closest?ev.target.closest(selector):null;
}
function dispatchButton(ev){
 const tb=buttonTarget(ev,'#tabs button');
 const t=buttonTarget(ev,'[data-act]');
 const b=tb||t;if(!b)return;
 const now=Date.now();
 if(ev.type==='click'&&b===lastButton&&now-lastButtonAt<700)return;
 lastButton=b;lastButtonAt=now;
 if(ev.cancelable)ev.preventDefault();
 ev.stopPropagation();
 try{
  if(tb)go(tb.dataset.tab);
  else act(t.dataset.act,t.dataset);
 }catch(err){console.error(err);toast('Action impossible : '+(err&&err.message?err.message:'erreur'))}
}
document.addEventListener('pointerup',dispatchButton,true);
document.addEventListener('click',dispatchButton,true);
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.dataset&&t.dataset.in&&S.active){const s=S.active.exos[+t.dataset.i].sets[+t.dataset.j];s[t.dataset.in]=t.value;save();const r=$('#remain');if(r)r.textContent=remainMin(S.active);return}
 if(t.id==='durC'){const v=Math.round(num(t.value));if(v>=10&&v<=300){S.ui.dur=v;save();$('#planBox').innerHTML=planHTML();document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));const m=document.querySelector('.chip[data-m="'+v+'"]');if(m)m.classList.add('on')}return}
 if(t.id==='exerciseSearch'){const q=slug(t.value||'');let shown=0;document.querySelectorAll('.exercise-library-row').forEach(r=>{const ok=!q||(r.dataset.search||'').includes(q);r.style.display=ok?'':'none';if(ok)shown++});const empty=$('#exerciseSearchEmpty');if(empty)empty.style.display=shown?'none':'block';return}
 if(t.id==='pickQ'){$('#pickL').innerHTML=pickHTML(t.value);return}
});
document.addEventListener('change',ev=>{
 if(ev.target.dataset.in==='bench'){const e=S.active&&S.active.exos[+ev.target.dataset.i];if(e){e.bench=ev.target.value;save();toast(e.bench?'Banc mémorisé : position '+e.bench:'Réglage du banc effacé')}return}
 if(ev.target.id==='sessionProgramSelect'){S.ui.progId=ev.target.value||null;save();render();return}
 if(ev.target.id==='themeToggle'){setTheme(ev.target.checked?'dark':'light');return}
 if(ev.target.id==='exSel'){S.ui.exKey=ev.target.value;save();drawDash()}
 if(ev.target.id==='homeExSel'){S.ui.homeExKey=ev.target.value;save();drawExerciseCompare()}
});
render();wake();
})();
</script>
